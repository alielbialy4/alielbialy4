<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="400" viewBox="0 0 1240 400" role="img" aria-labelledby="title desc">
<title id="title">Ali Elbialy — Backend Engineer</title>
<desc id="desc">Dark indigo and cyan developer banner with a stylized code editor.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080D20"/><stop offset=".54" stop-color="#101A35"/><stop offset="1" stop-color="#0A1023"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5EEAD4"/><stop offset=".55" stop-color="#60A5FA"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#162442"/><stop offset="1" stop-color="#0C152C"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#6D5EF8" stop-opacity=".38"/><stop offset="1" stop-color="#6D5EF8" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#92A8DA" stroke-opacity=".075" stroke-width="1"/></pattern>
  <filter id="shadow"><feGaussianBlur stdDeviation="14"/></filter>
  <clipPath id="clip"><rect width="1240" height="400" rx="25"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1240" height="400" fill="url(#bg)"/>
<rect width="1240" height="400" fill="url(#grid)"/>
<circle cx="1140" cy="80" r="320" fill="url(#glow)"/>
<circle cx="150" cy="390" r="240" fill="#124E65" opacity=".17" filter="url(#shadow)"/>
<path d="M0 391H1240" stroke="url(#accent)" stroke-width="5"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <rect x="65" y="54" width="150" height="29" rx="14.5" fill="#122942" stroke="#27606B"/>
  <circle cx="84" cy="68.5" r="4.5" fill="#5EEAD4"><animate attributeName="opacity" values="1;.3;1" dur="3s" repeatCount="indefinite"/></circle>
  <text x="99" y="73" font-size="12" font-weight="700" fill="#B3F5EA" letter-spacing="1.4">HELLO, WORLD</text>
  <text x="62" y="169" font-size="60" font-weight="800" letter-spacing="-2" fill="#F2F6FF">ALI <tspan fill="#75DEEF">ELBIALY</tspan></text>
  <text x="65" y="209" font-size="21" font-weight="750" fill="#C8D4EF" letter-spacing="4">BACKEND ENGINEER</text>
  <text x="65" y="258" font-size="22" fill="#E4EBFA">I design the systems behind great products.</text>
  <text x="65" y="291" font-size="16" fill="#94A9CA">APIs  /  SaaS  /  Commerce  /  Integrations</text>
  <g font-size="13" font-weight="700">
   <rect x="65" y="321" width="141" height="34" rx="17" fill="#173B43" stroke="#2C8B87"/><text x="90" y="343" fill="#8DF3DB">PHP · Laravel</text>
   <rect x="216" y="321" width="158" height="34" rx="17" fill="#1A2D52" stroke="#375A91"/><text x="238" y="343" fill="#AACDFF">System Design</text>
   <rect x="384" y="321" width="155" height="34" rx="17" fill="#312348" stroke="#65508E"/><text x="408" y="343" fill="#DCC5FF">Product Mindset</text>
  </g>
  <rect x="735" y="49" width="442" height="304" rx="17" fill="#030811" opacity=".6" filter="url(#shadow)"/>
  <rect x="735" y="43" width="442" height="304" rx="17" fill="url(#panel)" stroke="#334A73" stroke-width="1.6"/>
  <path d="M735 94H1177" stroke="#334A73"/>
  <circle cx="758" cy="69" r="5.5" fill="#FB7185"/><circle cx="777" cy="69" r="5.5" fill="#FBBF24"/><circle cx="796" cy="69" r="5.5" fill="#34D399"/>
  <text x="956" y="74" text-anchor="middle" font-size="12" fill="#90A5CA" letter-spacing="1">engineer.ts</text>
  <g font-family="SFMono-Regular,Consolas,Monaco,monospace" font-size="15">
    <text x="761" y="128" fill="#7184A8">01</text><text x="797" y="128"><tspan fill="#C4B5FD">const </tspan><tspan fill="#E5EEFD">engineer </tspan><tspan fill="#93C5FD">= </tspan><tspan fill="#E5EEFD">{</tspan></text>
    <text x="761" y="159" fill="#7184A8">02</text><text x="817" y="159"><tspan fill="#8CEBD8">name</tspan><tspan fill="#E5EEFD">: </tspan><tspan fill="#F9C97C">'Ali Elbialy'</tspan><tspan fill="#E5EEFD">,</tspan></text>
    <text x="761" y="190" fill="#7184A8">03</text><text x="817" y="190"><tspan fill="#8CEBD8">focus</tspan><tspan fill="#E5EEFD">: [</tspan><tspan fill="#F9C97C">'APIs'</tspan><tspan fill="#E5EEFD">, </tspan><tspan fill="#F9C97C">'SaaS'</tspan><tspan fill="#E5EEFD">],</tspan></text>
    <text x="761" y="221" fill="#7184A8">04</text><text x="817" y="221"><tspan fill="#8CEBD8">builds</tspan><tspan fill="#E5EEFD">: </tspan><tspan fill="#F9C97C">'reliable systems'</tspan><tspan fill="#E5EEFD">,</tspan></text>
    <text x="761" y="252" fill="#7184A8">05</text><text x="817" y="252"><tspan fill="#8CEBD8">curiosity</tspan><tspan fill="#E5EEFD">: </tspan><tspan fill="#B5A5F5">Infinity</tspan></text>
    <text x="761" y="283" fill="#7184A8">06</text><text x="797" y="283" fill="#E5EEFD">};</text>
  </g>
  <rect x="758" y="308" width="396" height="23" rx="7" fill="#10253D"/>
  <text x="774" y="324" font-size="11" fill="#7DEAD5" font-family="Consolas,monospace">● SYSTEMS ONLINE</text>
  <text x="1136" y="324" font-size="10" fill="#7994B7" text-anchor="end" font-family="Consolas,monospace">EGYPT · UTC+2</text>
</g>
<circle cx="1197" cy="30" r="2.2" fill="#7CE7DD"/>
<circle cx="679" cy="85" r="3" fill="#A89CFF" opacity=".85"/>
</g>
</svg>