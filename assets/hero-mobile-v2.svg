<svg xmlns="http://www.w3.org/2000/svg" width="760" height="780" viewBox="0 0 760 780" role="img" aria-labelledby="title desc"><title id="title">Ali Elbialy — Backend Engineer</title><desc id="desc">Electric green cyber-style mobile banner.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080B13"/><stop offset="1" stop-color="#14231C"/></linearGradient><pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#A5FF94" stroke-opacity=".08"/></pattern><radialGradient id="glow"><stop stop-color="#B4FF3B" stop-opacity=".22"/><stop offset="1" stop-color="#B4FF3B" stop-opacity="0"/></radialGradient><style>@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.28}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 33s linear infinite}.pulse{animation:pulse 2s ease-in-out infinite}</style></defs><rect width="760" height="780" rx="16" fill="url(#bg)"/><rect width="760" height="780" rx="16" fill="url(#grid)"/><rect width="760" height="6" fill="#B4FF3B"/><g font-family="Consolas,monospace"><text x="40" y="65" fill="#B4FF3B" letter-spacing="4" font-size="18">AE/ENGINEERING</text><text x="720" y="65" fill="#8395A5" text-anchor="end" font-size="13">SYS.V2.0</text><text x="40" y="154" fill="#B9C6D7" font-size="23" letter-spacing="6">HELLO, I'M</text></g><g font-family="Arial,sans-serif" font-weight="900" letter-spacing="-9"><text x="30" y="274" fill="#F3F5FB" font-size="135">ALI</text><text x="30" y="414" fill="#B4FF3B" font-size="130">ELBIALY<tspan fill="#F4F6FB">.</tspan></text></g><rect x="40" y="439" width="680" height="2" fill="#B4FF3B"/><text x="40" y="488" fill="#E6EEF7" font-family="Consolas,monospace" letter-spacing="5" font-size="28">BACKEND ENGINEER</text><text x="40" y="523" fill="#A2B3C3" font-family="Consolas,monospace" font-size="20">I build what you don't see.</text><g transform="translate(565 640)"><circle r="163" fill="url(#glow)"/><circle r="120" fill="none" stroke="#B4FF3B" opacity=".5" stroke-dasharray="6 11" class="spin"/><circle r="91" fill="none" stroke="#B4FF3B" opacity=".4"/><circle r="63" fill="#0f261b" stroke="#B4FF3B" stroke-width="2"/><text x="0" y="10" text-anchor="middle" font-family="Consolas,monospace" fill="#B4FF3B" font-size="33">&lt;AE/&gt;</text></g><circle cx="688" cy="650" r="5" fill="#B4FF3B" class="pulse"/><g font-family="Consolas,monospace" font-size="13" fill="#A2B4C9" letter-spacing="1"><text x="40" y="622">SYSTEMS / ONLINE</text><text x="40" y="650">APIS / SAAS</text><text x="40" y="678">COMMERCE / DATA</text></g><rect y="774" width="760" height="6" fill="#B4FF3B"/></svg>