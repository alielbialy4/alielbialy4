<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title desc">
<title id="title">Ali Elbialy — Backend Engineer</title><desc id="desc">Mobile banner featuring Ali's name and a code editor on a midnight blue gradient.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080D20"/><stop offset=".6" stop-color="#102044"/><stop offset="1" stop-color="#0C1128"/></linearGradient>
<radialGradient id="light"><stop stop-color="#8B5CF6" stop-opacity=".32"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="37" height="37" patternUnits="userSpaceOnUse"><path d="M37 0H0V37" fill="none" stroke="#A4B7E5" stroke-opacity=".07"/></pattern>
<clipPath id="round"><rect width="720" height="760" rx="22"/></clipPath>
</defs>
<g clip-path="url(#round)">
<rect width="720" height="760" fill="url(#bg)"/><rect width="720" height="760" fill="url(#grid)"/>
<circle cx="600" cy="125" r="330" fill="url(#light)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
<rect x="42" y="49" width="184" height="40" rx="20" fill="#153446" stroke="#246C6B"/>
<circle cx="64" cy="69" r="6" fill="#5EEAD4"><animate attributeName="opacity" values="1;.3;1" dur="3s" repeatCount="indefinite"/></circle>
<text x="83" y="75" font-size="16" font-weight="700" fill="#B3F5EA" letter-spacing="1.4">HELLO, WORLD</text>
<text x="39" y="182" font-size="78" font-weight="800" fill="#F4F7FF" letter-spacing="-2">ALI</text>
<text x="39" y="272" font-size="78" font-weight="800" fill="#7DE4F1" letter-spacing="-2">ELBIALY</text>
<text x="43" y="314" font-size="23" font-weight="700" fill="#C3D1ED" letter-spacing="4.5">BACKEND ENGINEER</text>
<text x="43" y="362" font-size="22" fill="#E7EEFF">Building the systems behind great products.</text>
<text x="43" y="394" font-size="19" fill="#94ACCB">APIs  /  SaaS  /  Commerce  /  Integrations</text>
<rect x="42" y="428" width="635" height="273" rx="20" fill="#101A31" stroke="#334B72" stroke-width="2"/>
<path d="M42 478H677" stroke="#30466A"/>
<circle cx="69" cy="453" r="6.5" fill="#FB7185"/><circle cx="92" cy="453" r="6.5" fill="#FBBF24"/><circle cx="115" cy="453" r="6.5" fill="#34D399"/>
<text x="360" y="460" text-anchor="middle" font-size="16" fill="#90A5CA">engineer.ts</text>
<g font-family="Consolas,Monaco,monospace" font-size="22">
<text x="69" y="525"><tspan fill="#C4B5FD">const </tspan><tspan fill="#E8F1FF">engineer </tspan><tspan fill="#93C5FD">= </tspan><tspan fill="#E8F1FF">{</tspan></text>
<text x="90" y="562"><tspan fill="#8CEBD8">name</tspan><tspan fill="#E8F1FF">: </tspan><tspan fill="#F9C97C">'Ali Elbialy'</tspan><tspan fill="#E8F1FF">,</tspan></text>
<text x="90" y="599"><tspan fill="#8CEBD8">focus</tspan><tspan fill="#E8F1FF">: [</tspan><tspan fill="#F9C97C">'APIs'</tspan><tspan fill="#E8F1FF">, </tspan><tspan fill="#F9C97C">'SaaS'</tspan><tspan fill="#E8F1FF">],</tspan></text>
<text x="90" y="636"><tspan fill="#8CEBD8">passion</tspan><tspan fill="#E8F1FF">: </tspan><tspan fill="#F9C97C">'building'</tspan></text>
<text x="69" y="673" fill="#E8F1FF">};</text>
</g>
<path d="M0 753H720" stroke="#74DCED" stroke-width="6"/>
</g>
